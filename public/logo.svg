<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Grafter">
  <title>Grafter</title>
  <!-- Mark: three ascending blocks (an audit score climbing, a store being
       built up) with a notch cut from the tallest block so the silhouette
       reads as a mark on its own, not just a bar chart — a deliberate nod
       to the reference's offset-block icon, built as an original form. -->
  <g fill="#171714">
    <rect x="0"  y="68" width="34" height="52" />
    <rect x="43" y="40" width="34" height="80" />
    <path d="M86,4 H104 V22 H120 V120 H86 Z" />
  </g>

  <!-- Wordmark -->
  <text
    x="150"
    y="88"
    font-family="Fraunces, Georgia, 'Times New Roman', serif"
    font-weight="600"
    font-size="64"
    letter-spacing="-1"
    fill="#171714"
  >grafter</text>
</svg>
